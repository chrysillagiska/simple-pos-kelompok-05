openapi: 3.0.0

info:
  title: Simple POS API
  version: 1.0.0
  description: Dokumentasi REST API untuk aplikasi Simple POS.
  license:
    name: MIT
    url: https://opensource.org/license/mit/
servers:
  - url: http://127.0.0.1:8000
    description: Local development server

paths:
  /api/v1/login:
    post:
      summary: Login dan dapatkan token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/v1/products:
    get:
      summary: Ambil daftar produk
      operationId: getProducts
      description: Mengambil daftar produk dengan fitur filter kategori, pencarian, sorting, dan pagination.
      security:
        - bearerAuth: []
      parameters:
        - name: category_id
          in: query
          required: false
          description: Filter produk berdasarkan ID kategori
          schema:
            type: integer
        - name: q
          in: query
          required: false
          description: Pencarian berdasarkan nama produk (minimal 2 karakter)
          schema:
            type: string
            minLength: 2
        - name: sort
          in: query
          required: false
          description: Pengurutan produk berdasarkan nama atau harga. Awali dengan tanda minus (-) untuk urutan descending.
          schema:
            type: string
            enum:
              - name
              - '-name'
              - price
              - '-price'
            default: name
        - name: per_page
          in: query
          required: false
          description: Jumlah produk per halaman (minimal 1, maksimal 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: page
          in: query
          required: false
          description: Nomor halaman pagination
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Daftar produk berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        price:
                          type: integer
                        category:
                          type: string
                          nullable: true
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        nullable: true
                      last:
                        type: string
                        nullable: true
                      prev:
                        type: string
                        nullable: true
                      next:
                        type: string
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      from:
                        type: integer
                        nullable: true
                      last_page:
                        type: integer
                      links:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              nullable: true
                            label:
                              type: string
                            page:
                              type: integer
                              nullable: true
                            active:
                              type: boolean
                      path:
                        type: string
                      per_page:
                        type: integer
                      to:
                        type: integer
                        nullable: true
                      total:
                        type: integer
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Parameter query tidak valid

  /api/v1/transactions:
    post:
      summary: Buat transaksi baru
      operationId: createTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - product_id
                      - qty
                    properties:
                      product_id:
                        type: integer
                      qty:
                        type: integer
      responses:
        '201':
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      total:
                        type: integer
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Input tidak valid, misalnya product_id tidak ditemukan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token